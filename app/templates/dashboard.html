<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stay Focused | Yönetim</title><link rel="stylesheet" href="/static/style.css"></head><body class="dashboard"><header><div class="logo">STAY <span>FOCUSED</span></div><a href="/">Siteye Dön</a></header><main class="dash"><div class="eyebrow">YÖNETİM PANELİ</div><h1>Müşteri adayları</h1><div class="stats"><div><small>TOPLAM</small><strong id="total">0</strong></div><div><small>BUGÜN</small><strong id="today">0</strong></div><div><small>MARKA DURUMU</small><strong>AKTİF</strong></div></div><div class="table-wrap"><table><thead><tr><th>Ad Soyad</th><th>E-posta</th><th>Telefon</th><th>Mesaj</th><th>Tarih</th></tr></thead><tbody id="rows"><tr><td colspan="5">Kayıtlar yükleniyor...</td></tr></tbody></table></div></main><script>fetch('/api/leads').then(r=>r.json()).then(d=>{document.getElementById('total').textContent=d.total; document.getElementById('today').textContent=d.total; const b=document.getElementById('rows'); b.innerHTML=d.leads.length?d.leads.map(x=>`<tr><td>${x.name}</td><td>${x.email||'-'}</td><td>${x.phone||'-'}</td><td>${x.message||'-'}</td><td>${x.created_at}</td></tr>`).join(''):'<tr><td colspan="5">Henüz kayıt bulunmuyor.</td></tr>'})</script></body></html>
